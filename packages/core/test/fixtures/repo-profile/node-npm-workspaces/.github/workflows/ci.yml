name: ci
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
    env:
      DATABASE_URL: postgres://postgres@localhost/shop
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test
      - run: |
          npm run lint && npm run build
          echo done
