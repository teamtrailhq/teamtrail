# Every PR and every push to main runs the full project check: lint, format, typecheck, build, unit and node
# tests, and the MCP end-to-end test (a real MCP client drives a trail while Chrome shows the Lookout).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - id: chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3
      # Git evidence and verification tests commit in temp repos.
      - run: |
          git config --global user.name "Teamtrail CI"
          git config --global user.email "ci@teamtrail.app"
      - run: npm ci
      - run: npm run check
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
